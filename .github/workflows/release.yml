name: Release

on:
  workflow_dispatch: # allows manual triggering
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean
  push:
    branches:
      - master
    paths: [
      '.github/workflows/release.yml',
      '**/CMakeLists.txt',
      '**/.cmake',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      '**/*.cu',
      '**/*.cuh',
      '**/*.swift',
      '**/*.m',
      '**/*.metal',
      '**/*.comp',
      '**/*.glsl'
    ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON"

jobs:
  ubuntu-24-cpu:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: ubuntu-cpu-x64
          evict-old-files: 1d

      - name: Dependencies
        id: depends
        run: |
          sudo apt-get update
          sudo apt-get install build-essential libssl-dev
      - name: Toolchain workaround (GCC 14)
        run: |
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: Build
        id: cmake_build
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DLLAMA_FATAL_WARNINGS=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)
      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czvf llama-${{ steps.tag.outputs.name }}-bin-ubuntu-x64.tar.gz --transform "s,./,llama-${{ steps.tag.outputs.name }}/," -C ./build/bin .
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-${{ steps.tag.outputs.name }}-bin-ubuntu-x64.tar.gz
          name: llama-bin-ubuntu-x64.tar.gz

  ubuntu-24-cuda13:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pull container image
        run: docker pull nvidia/cuda:13.0.0-devel-ubuntu24.04

      - name: Build
        run: |
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            nvidia/cuda:13.0.0-devel-ubuntu24.04 \
            bash -lc '
              set -e
              apt update
              apt install -y cmake build-essential ninja-build libgomp1 git libssl-dev ccache
              apt-get install -y gcc-14 g++-14
              git config --global --add safe.directory "/workspace"
              cmake -S . -B build -G Ninja \
                -DCMAKE_INSTALL_RPATH='$ORIGIN' \
                -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
                -DLLAMA_FATAL_WARNINGS=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CUDA_ARCHITECTURES="120-real" \
                -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined \
                -DGGML_NATIVE=OFF \
                -DGGML_CUDA=ON \
                -DGGML_CUDA_CUB_3DOT2=ON \
                ${{ env.CMAKE_ARGS }}
              cmake --build build --config Release -j $(nproc)
              chown -R '"${HOST_UID}"':'"${HOST_GID}"' /workspace/build
            '
      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czvf llama-${{ steps.tag.outputs.name }}-bin-ubuntu-24-cuda13-x64.tar.gz --transform "s,./,llama-${{ steps.tag.outputs.name }}/," -C ./build/bin .
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-${{ steps.tag.outputs.name }}-bin-ubuntu-24-cuda13-x64.tar.gz
          name: llama-bin-ubuntu-24-cuda13-x64.tar.gz

  ubuntu-22-cuda13:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pull container image
        run: docker pull nvidia/cuda:13.0.0-devel-ubuntu22.04

      - name: Build
        run: |
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            nvidia/cuda:13.0.0-devel-ubuntu22.04 \
            bash -lc '
              set -e
              apt update
              apt install -y cmake build-essential ninja-build libgomp1 git libssl-dev ccache
              git config --global --add safe.directory "/workspace"
              cmake -S . -B build -G Ninja \
                -DCMAKE_INSTALL_RPATH='$ORIGIN' \
                -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
                -DLLAMA_FATAL_WARNINGS=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CUDA_ARCHITECTURES="120-real" \
                -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined \
                -DGGML_NATIVE=OFF \
                -DGGML_CUDA=ON \
                -DGGML_CUDA_CUB_3DOT2=ON \
                ${{ env.CMAKE_ARGS }}
              cmake --build build --config Release -j $(nproc)
              chown -R '"${HOST_UID}"':'"${HOST_GID}"' /workspace/build
            '
      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czvf llama-${{ steps.tag.outputs.name }}-bin-ubuntu-22-cuda13-x64.tar.gz --transform "s,./,llama-${{ steps.tag.outputs.name }}/," -C ./build/bin .
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-${{ steps.tag.outputs.name }}-bin-ubuntu-22-cuda13-x64.tar.gz
          name: llama-bin-ubuntu-22-cuda13-x64.tar.gz

  openeuler-2203-cuda13:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pull container image
        run: docker pull openeuler/openeuler:22.03-lts-sp3

      - name: Build
        run: |
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            openeuler/openeuler:22.03-lts-sp3 \
            bash -lc '
              set -e
              # 添加 NVIDIA 源
              sed -i "s|http://repo.openeuler.org|https://mirrors.aliyun.com/openeuler|g" /etc/yum.repos.d/openEuler.repo
              sed -i "s|https://repo.openeuler.org|https://mirrors.aliyun.com/openeuler|g" /etc/yum.repos.d/openEuler.repo
              sed -i "/metalink/d" /etc/yum.repos.d/openEuler.repo
              echo -e "[cuda]\nname=cuda\nbaseurl=https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/\nenabled=1\ngpgcheck=0" > /etc/yum.repos.d/cuda.repo

              # 更新源
              dnf update -y

              # 安装基础编译工具
              dnf install -y wget gcc g++ gcc-c++ make cmake git ninja-build openssl-devel kernel-devel ccache

              # 安装 NCCL（从 NVIDIA 源）
              dnf install -y libnccl libnccl-devel
              # 下载并安装 CUDA
              echo "Downloading and installing CUDA Toolkit 13.3..."
              wget -q https://developer.download.nvidia.com/compute/cuda/13.3.0/local_installers/cuda_13.3.0_610.43.02_linux.run -O /tmp/cuda-toolkit.run
              bash /tmp/cuda-toolkit.run --silent --toolkit

              # 设置环境变量
              export PATH=/usr/local/cuda/bin:$PATH
              export LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH

              # Git 安全配置
              git config --global --add safe.directory "/workspace"

              # 配置和编译
              cmake -S . -B build -G Ninja \
                -DCMAKE_INSTALL_RPATH='$ORIGIN' \
                -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
                -DLLAMA_FATAL_WARNINGS=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CUDA_ARCHITECTURES="75" \
                -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined \
                -DGGML_NATIVE=OFF \
                -DGGML_CUDA=ON \
                -DGGML_CUDA_CUB_3DOT2=ON \
                ${{ env.CMAKE_ARGS }}
              cmake --build build --config Release -j $(nproc)
              chown -R '"${HOST_UID}"':'"${HOST_GID}"' /workspace/build
            '
      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czvf llama-${{ steps.tag.outputs.name }}-bin-openeuler-2203-cuda13-x64.tar.gz --transform "s,./,llama-${{ steps.tag.outputs.name }}/," -C ./build/bin .
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-${{ steps.tag.outputs.name }}-bin-openeuler-2203-cuda13-x64.tar.gz
          name: llama-bin-openeuler-2203-cuda13-x64.tar.gz


  release:
    if: ${{ ( github.event_name == 'push' && github.ref == 'refs/heads/master' ) || github.event.inputs.create_release == 'true' }}

    # Fine-grant permission
    # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
        contents: write # for creating release

    runs-on: ubuntu-slim

    needs:
      - ubuntu-24-cpu
      - ubuntu-24-cuda13
      - ubuntu-22-cuda13
      - openeuler-2203-cuda13

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Download artifacts
        id: download-artifact
        uses: actions/download-artifact@v7
        with:
          path: ./artifact
          merge-multiple: true

      - name: Move artifacts
        id: move_artifacts
        run: |
          mkdir -p release
          echo "Moving other artifacts..."
          mv -v artifact/*.tar.gz release

      - name: Generate SHA256 checksums
        id: checksums
        run: |
          sha256sum ./release/*.tar.gz > ./release/SHA256SUMS.txt
          cat ./release/SHA256SUMS.txt
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body: |
            <details open>
            ${{ github.event.head_commit.message }}
            </details>
          generate_release_notes: false
      - name: Upload release
        id: upload_release
        uses: actions/github-script@v8
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const path = require('path');
            const fs = require('fs');
            const release_id = '${{ steps.create_release.outputs.id }}';
            for (let file of await fs.readdirSync('./release')) {
              if (path.extname(file) === '.zip' || file.endsWith('.tar.gz') || file === 'SHA256SUMS.txt') {
                console.log('uploadReleaseAsset', file);
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release_id,
                  name: file,
                  data: await fs.readFileSync(`./release/${file}`)
                });
              }
            }
